name: commit-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  subject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 20
      - name: Conventional commits
        run: |
          bad=0
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq '^(feat|fix|perf|docs|refactor|test|chore|ci)(\([a-z0-9-]+\))?!?: .+'; then
              echo "::error::not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --format=%s -n 20)
          exit "$bad"
