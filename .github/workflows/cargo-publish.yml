name: cargo publish

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Required reviewers on this environment gate every publish.
    environment: crates-io
    env:
      TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Validate tag against Cargo.toml
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a stable release tag: '$TAG'"
            exit 1
          fi
          version="${TAG#v}"
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::tag $TAG does not match workspace version $crate_version"
            exit 1
          fi

      - name: Publish mcpscan-core
        run: cargo publish -p mcpscan-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for the index, then publish mcpscan
        run: |
          sleep 45
          cargo publish -p mcpscan --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
