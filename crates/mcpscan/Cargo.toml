[package]
name = "mcpscan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scan MCP servers, agent configs and tool definitions for security issues"

[[bin]]
name = "mcpscan"
path = "src/main.rs"

[dependencies]
mcpscan-core = { path = "../mcpscan-core", version = "=0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
