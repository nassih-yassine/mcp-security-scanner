name: mcpscan
description: >-
  Scan MCP servers, agent configs and tool definitions for leaked credentials,
  scope creep, tool poisoning and known-vulnerable packages. Uploads SARIF to
  code scanning by default.
author: nassih-yassine
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Directory to scan.
    required: false
    default: "."
  format:
    description: Report format (human, json, sarif, markdown).
    required: false
    default: sarif
  output:
    description: File to write the report to. Empty means stdout.
    required: false
    default: mcpscan.sarif
  fail-on:
    description: Severity that fails the step (low, medium, high, critical, none).
    required: false
    default: critical
  version:
    description: mcpscan version to install. Defaults to this action's tag.
    required: false
    default: ""
  upload:
    description: Upload SARIF to GitHub code scanning.
    required: false
    default: "true"

outputs:
  score:
    description: Letter grade from the markdown report (A-F), when available.
    value: ${{ steps.report.outputs.score }}

runs:
  using: composite
  steps:
    - name: Resolve version and target
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*) version="${ACTION_REF#v}" ;;
            *)
              echo "::error::no version input and the action ref '$ACTION_REF' is not a version tag."
              exit 1
              ;;
          esac
        fi
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64) target="x86_64-unknown-linux-gnu" ;;
          Linux/aarch64|Linux/arm64)
            echo "::error::no Linux arm64 build yet. Install with: cargo install mcpscan --locked"
            exit 1 ;;
          Darwin/arm64) target="aarch64-apple-darwin" ;;
          Darwin/x86_64) target="x86_64-apple-darwin" ;;
          *)
            echo "::error::unsupported platform: $(uname -s)/$(uname -m). Install mcpscan with cargo instead."
            exit 1
            ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "target=$target" >> "$GITHUB_OUTPUT"

    - name: Install mcpscan
      shell: bash
      env:
        VERSION: ${{ steps.setup.outputs.version }}
        TARGET: ${{ steps.setup.outputs.target }}
        LOCAL_BIN: ${{ env.MCPScan_LOCAL_BIN }}
      run: |
        set -euo pipefail
        bin_dir="$RUNNER_TEMP/mcpscan-bin"
        mkdir -p "$bin_dir"
        if [ -n "${LOCAL_BIN:-}" ]; then
          echo "using local binary: $LOCAL_BIN"
          cp "$LOCAL_BIN" "$bin_dir/mcpscan"
        else
          base="https://github.com/nassih-yassine/mcp-security-scanner/releases/download/v${VERSION}"
          archive="mcpscan-${TARGET}.tar.xz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/sha256.sum" "$base/sha256.sum"
          # sha256.sum lines are "<hash> *<name>" (binary marker).
          ( cd "$RUNNER_TEMP" && grep -F "$archive" sha256.sum | sha256sum --check --strict - )
          extract="$RUNNER_TEMP/mcpscan-extract"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$extract"
          found="$(find "$extract" -type f -name mcpscan | head -1)"
          if [ -z "$found" ]; then
            echo "::error::mcpscan binary not found in $archive"
            exit 1
          fi
          cp "$found" "$bin_dir/mcpscan"
        fi
        chmod +x "$bin_dir/mcpscan"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Scan
      id: report
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        args=(scan "$INPUT_PATH" --format "$INPUT_FORMAT" --fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_OUTPUT" ]; then
          args+=(--output "$INPUT_OUTPUT")
        fi
        status=0
        mcpscan "${args[@]}" || status=$?
        if [ "$status" -eq 3 ]; then
          echo "::error::mcpscan could not complete the scan (exit 3)."
        fi
        grade="$(mcpscan scan "$INPUT_PATH" --format markdown --fail-on none 2>/dev/null \
          | sed -n 's/^## MCP security score: \(.\).*/\1/p' | head -1)"
        echo "score=${grade:-}" >> "$GITHUB_OUTPUT"
        # 2 fails the step on findings; the SARIF upload below uses always().
        exit "$status"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload == 'true' && inputs.format == 'sarif' && inputs.output != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: mcpscan
