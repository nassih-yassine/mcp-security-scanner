[workspace]
members = ["crates/mcpscan-core", "crates/mcpscan", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nassih-yassine/mcp-security-scanner"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
