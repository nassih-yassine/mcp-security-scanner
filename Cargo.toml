[workspace]
members = ["crates/mcpscan-core", "crates/mcpscan", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nassih-yassine/mcp-security-scanner"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# cargo-dist builds with this profile; without it the release job fails.
[profile.dist]
inherits = "release"
lto = "thin"
